<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Travagli Club</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Travagli">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070b; --card:#0d1219; --card2:#141b25; --line:#1f2a38;
    --tx:#eef3fb; --mut:#7f8ca0; --acc:#1f9fe3; --acc2:#6fd0ff; --danger:#ff5a6a; --ink:#fff;
    --gold:#ffd24a; --silver:#cfd6e0; --bronze:#e0995a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:16px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
  label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px;font-weight:600}
  header{position:sticky;top:0;z-index:6;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:10px}
  .mono{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--acc),#0b5a9e);display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:20px;transform:skewX(-8deg);box-shadow:0 4px 18px rgba(31,159,227,.35)}
  .monoimg{height:38px;width:auto;display:block;filter:drop-shadow(0 2px 10px rgba(31,163,230,.35))}
  .logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:2px;line-height:1}
  .logo span{color:var(--acc)}
  .tag{font-size:11px;color:var(--mut);margin-top:3px;letter-spacing:.3px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me-btn{margin-left:auto;width:40px;height:40px;border-radius:50%;padding:0;border:2px solid var(--acc);background:var(--card2);overflow:hidden}
  .me-btn img{width:100%;height:100%;object-fit:cover;display:block}
  .tabs{position:sticky;top:62px;z-index:5;background:var(--bg);display:flex;gap:4px;padding:6px 14px 10px;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:0;padding:9px 2px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--mut);position:relative}
  .tabs button.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
  main{padding:14px 14px 110px;max-width:620px;margin:0 auto}
  .fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:7;display:flex;align-items:center;gap:8px;background:var(--acc);color:#fff;border:0;border-radius:16px;padding:14px 18px 14px 14px;font-weight:700;font-size:15px;box-shadow:0 10px 28px rgba(31,159,227,.45)}
  .fab svg{width:22px;height:22px}
  .hero{background:radial-gradient(120% 140% at 100% 0%,rgba(31,159,227,.35),transparent 60%),var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
  .hero .big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:44px;line-height:1}
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
  .sec h4{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:1.2px;text-transform:uppercase}
  .post{padding:10px}
  .post .pw{position:relative;border-radius:14px;overflow:hidden}
  .post .ov{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));display:flex;align-items:center;gap:8px;color:#fff;cursor:pointer}
  .post .meta{display:flex;align-items:center;gap:8px;padding:10px 4px 0}
  .post .acts{padding:0;margin-left:auto;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
  .pad{padding:14px}
  .row{display:flex;align-items:center;gap:10px}
  .av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;background:var(--card2)}
  .av.sm{width:28px;height:28px}
  .av.lg{width:76px;height:76px}
  .nm{font-weight:700}
  .mut{color:var(--mut);font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
  .badge.acc{background:rgba(31,159,227,.12);border-color:rgba(31,159,227,.35);color:var(--acc)}
  .photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--card2)}
  .ph-wait{width:100%;aspect-ratio:1/1;background:linear-gradient(90deg,var(--card2),#262a30,var(--card2));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .acts{display:flex;gap:18px;padding:10px 14px 4px}
  .acts button{background:none;border:0;display:flex;align-items:center;gap:6px;padding:4px 0;font-weight:600}
  .acts svg{width:24px;height:24px}
  .liked{color:var(--danger)}
  .cap{padding:8px 4px 4px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
  .btn{background:var(--acc);color:var(--ink);border:0;border-radius:14px;padding:14px 16px;font-weight:700;width:100%;font-size:16px}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(255,90,95,.4)}
  .btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
  h2{font-family:'Archivo Black',sans-serif;font-size:22px;margin:6px 0 12px;letter-spacing:.2px}
  h3{font-size:16px;margin:0 0 4px}
  .empty{text-align:center;color:var(--mut);padding:40px 20px;line-height:1.5}
  .empty .big{font-size:44px;margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
  .chip.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}
  .seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg .chip{white-space:nowrap}
  .rk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
  .rk:first-child{border-top:0}
  .pos{width:28px;text-align:center;font-family:'Archivo Black',sans-serif;font-size:16px;color:var(--mut)}
  .pos.p1{color:var(--gold)} .pos.p2{color:var(--silver)} .pos.p3{color:var(--bronze)}
  .pts{margin-left:auto;text-align:right}
  .pts b{font-family:'Archivo Black',sans-serif;font-size:20px;color:var(--acc)}
  .rk.me{background:rgba(31,159,227,.06)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
  .stat b{display:block;font-family:'Archivo Black',sans-serif;font-size:24px;color:var(--acc)}
  .stat span{font-size:12px;color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .grid div{aspect-ratio:1;background:var(--card2);border-radius:6px;overflow:hidden}
  .grid img{width:100%;height:100%;object-fit:cover;display:block}
  .bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
  @keyframes fd{from{opacity:0}}
  .sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(40px)}}
  .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .sheet-h h2{margin:0}
  .x{background:var(--card2);border:0;border-radius:50%;width:34px;height:34px;font-size:18px}
  .drop{border:2px dashed var(--line);border-radius:16px;aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mut);position:relative;overflow:hidden;background:var(--card2)}
  .drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .drop svg{width:44px;height:44px}
  .cm{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .cm .t{line-height:1.4;white-space:pre-wrap;word-break:break-word}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#0e1a2b;color:#fff;border:1px solid var(--acc);box-shadow:0 8px 24px rgba(0,0,0,.55);padding:11px 18px;border-radius:999px;font-weight:600;z-index:40;font-size:14px;max-width:90vw;text-align:center}
  .note{background:rgba(255,210,74,.1);border:1px solid rgba(255,210,74,.35);color:#ffe08a;border-radius:14px;padding:12px;font-size:13px;line-height:1.45;margin-bottom:14px}
  .ch-st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.ch-tag{font-size:12px;font-weight:700;color:var(--gold);padding:9px 14px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.5px}
.card.post.ch-post{border-color:var(--gold)}
  .st-on{color:var(--acc)} .st-up{color:var(--gold)} .st-end{color:var(--mut)}
  .srow{display:grid;grid-template-columns:38px 1fr 1fr 44px 26px;gap:6px;align-items:center;margin-top:8px}
  .srow input{width:100%;min-width:0}
  .srow.done input{border-color:var(--acc);background:rgba(31,159,227,.10)}
  .stype{height:40px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-weight:800}
  .stype.ro{cursor:default;opacity:.9}
  .stype.tA,.stype.tP{color:var(--acc)} .stype.tD{color:var(--gold)} .stype.tF{color:var(--danger)}
  .scheck{height:40px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-weight:800;font-size:18px}
  .scheck.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .exnote{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--card2);font-size:13px;line-height:1.4}
  .restbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--acc);border-radius:16px;padding:10px 12px;box-shadow:0 10px 28px rgba(0,0,0,.5)}
  .restbar .rt{flex:1;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  .restbar button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 10px;font-weight:700}
  .mitem{display:block;width:100%;text-align:left;padding:15px 4px;border:0;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;background:none;color:var(--tx)}
  .mitem:last-child{border-bottom:0} .mitem.danger{color:var(--danger)}
  .rec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .rec div{background:var(--card2);border-radius:12px;padding:10px}
  .rec b{display:block;font-size:22px;font-variant-numeric:tabular-nums} .rec span{font-size:12px;color:var(--mut)}
  .gbar{display:grid;grid-template-columns:100px 1fr 34px;gap:10px;align-items:center;margin-top:9px;font-size:14px}
  .gtrack{height:12px;border-radius:6px;background:var(--card2);overflow:hidden}
  .gtrack i{display:block;height:100%;background:var(--acc);border-radius:6px}
  .gbar b{text-align:right;font-variant-numeric:tabular-nums}
  .wbars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:130px;margin-top:8px}
  .wbar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--mut)}
  .wbar i{width:100%;max-width:26px;background:#253049;border-radius:6px 6px 3px 3px;min-height:3px;display:block}
  .wbar.cur i{background:var(--acc)} .wbar b{color:var(--tx);font-size:12px}
  .pick{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .pick input{width:22px;height:22px;accent-color:var(--acc);flex:none}
  .link{background:none;border:0;color:var(--acc);font-weight:600;padding:0}
  .center{display:flex;flex-direction:column;align-items:center;text-align:center}
  .loading{padding:60px 20px;text-align:center;color:var(--mut)}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kv .stat{text-align:left}
  .kv .stat b{font-size:22px}
  .dl{font-size:12px;font-weight:700;margin-top:3px}
  .up{color:#4ade80} .dn{color:#ff7a85}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl td,.tbl th{padding:9px 4px;border-top:1px solid var(--line);text-align:right}
  .tbl td:first-child,.tbl th:first-child{text-align:left}
  .tbl th{color:var(--mut);font-size:12px;font-weight:600;border-top:0}
  .txt{white-space:pre-wrap;line-height:1.55;word-break:break-word}
  .chart{width:100%;height:auto;display:block}
  .warn{color:var(--gold)}
  .emoji-hero{font-size:56px;line-height:1}
</style>
</head>

<script>

const SUPABASE_URL = 'https://psyabagzgkskdwldcmto.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ibCLqMeZ-CxQnxRz1eb9NQ_Lye9ON9Q';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });
const sessionReady = sb.auth.getSession().then(r => r.data.session);
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const subs = new Set();
let rtStarted = false;

function startRealtime(){
  if (rtStarted) return; rtStarted = true;
  sb.channel('docs-rt').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, payload => {
    const p = (payload.new && payload.new.path) || (payload.old && payload.old.path) || null;
    subs.forEach(s => { if (!p || s.match(p)) s.refresh(); });
  }).subscribe();
}
function watch(match, get, cb, onErr){
  const sub = { match, refresh: async () => { try { cb(await get()); } catch (e) { onErr && onErr(e); } } };
  subs.add(sub); startRealtime(); sub.refresh();
  return () => subs.delete(sub);
}
async function selectAll(build){
  const out = [], PAGE = 1000;
  for (let from = 0; ; from += PAGE){
    const { data, error } = await build().range(from, from + PAGE - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < PAGE) break;
  }
  return out;
}
const snapOf = rows => ({ docs: rows.map(r => ({ id: r.path.split('/').pop(), exists: true, data: () => r.data })), metadata: { fromCache: false } });

class Col {
  constructor(path, o = {}){ this.path = path; this.o = o; }
  orderBy(field, dir = 'asc'){ return new Col(this.path, { ...this.o, field, dir }); }
  limit(n){ return new Col(this.path, { ...this.o, limit: n }); }
  doc(id){ return new Ref(this.path + '/' + (id || newId())); }
  async add(data){ const r = this.doc(); await r.set(data); return r; }
  async rows(){
    let rows = await selectAll(() => sb.from('docs').select('path,data').like('path', this.path + '/%').order('path'));
    rows = rows.filter(r => !r.path.slice(this.path.length + 1).includes('/'));
    const f = this.o.field;
    if (f) rows.sort((a, b) => { const x = a.data[f], y = b.data[f]; const r = x > y ? 1 : x < y ? -1 : 0; return this.o.dir === 'desc' ? -r : r; });

  }

  onSnapshot(cb, onErr){ const pre = this.path + '/'; return watch(p => p.startsWith(pre), () => this.get(), cb, onErr); }
}

class Ref {
  constructor(path){ this.path = path; this.id = path.split('/').pop(); }
  async get(){
    const { data, error } = await sb.from('docs').select('data').eq('path', this.path).maybeSingle();
    if (error) throw error;
    return { id: this.id, exists: !!data, data: () => (data ? data.data : undefined) };
  }
  async set(d){
    const { error } = await sb.from('docs').upsert({ path: this.path, data: d });
    if (error) throw error;
  }
  async update(patch){
    const cur = await this.get();
    if (!cur.exists) throw new Error('Documento não existe');
    await this.set({ ...cur.data(), ...patch });
  }
  async delete(){
    const { error } = await sb.from('docs').delete().eq('path', this.path);
    if (error) throw error;
  }
  onSnapshot(cb, onErr){ const p0 = this.path; return watch(p => p === p0, () => this.get(), cb, onErr); }
}

      while (out.length > 190000 && q > .35){ q -= .08; out = cv.toDataURL('image/jpeg', q); }

    };

function compressAvatar(file){
  return compress(file).then(d => new Promise(res => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(img.width, img.height), cv = document.createElement('canvas'); cv.width = cv.height = 200;
      cv.getContext('2d').drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 200, 200);
      res(cv.toDataURL('image/jpeg', .75));
    }; img.src = d;
  }));
}

// ---------- write wrapper ----------
async function w(fn, okMsg){
  if (S.readOnly){ toast('Seu acesso é só de leitura. Peça ao Léo para te convidar como editor.'); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){
    console.warn(e);
    if (e && e.code === 'quota_exceeded') toast('O espaço de fotos encheu. Avise o Léo.');
    else if (e && e.code === 'invalid_argument'){ S.readOnly = true; toast('Sem permissão para salvar. Peça ao Léo um convite como editor.'); }
    else toast('Não deu para salvar. Tente de novo.');
    return false;
  }
}

// ---------- feed ----------
function feedView(){
  const wrap = el('div');
  const t = today();
  const mine = S.checkins.filter(k => k.u === S.me && k.date === t).length;
  if (S.readOnly) wrap.append(el('div',{class:'note', text:'Seu acesso está só como visualização. Para registrar treinos, peça ao Léo para te convidar como editor.'}));
  // hero
  const st = streak(S.me), dset = userDates(S.me);
  const dots = el('div',{class:'row', style:'gap:6px;margin-top:14px'});
  const wk = ['D','S','T','Q','Q','S','S'];
  for (let i = 6; i >= 0; i--){ const d = addDays(t,-i); const [y,m,dd] = d.split('-').map(Number); const on = dset.has(d);
    dots.append(el('div',{style:'flex:1;text-align:center'}, el('div',{style:'height:6px;border-radius:9px;background:'+(on?'var(--acc)':'var(--card2)')}), el('div',{class:'mut', style:'font-size:11px;margin-top:5px', text:wk[new Date(y,m-1,dd).getDay()]}))); }
  const first = (nick(S.me).split(' ')[0]);
  wrap.append(el('div',{class:'hero'},
    el('div',{class:'mut', text: mine ? (mine === 1 ? 'Você já postou hoje ✓' : mine+' treinos postados hoje ✓') : 'Olá, '+first+'! Bora treinar hoje?'}),
    el('div',{class:'row', style:'align-items:flex-end;margin-top:8px'},
      el('div',{}, el('div',{class:'big', text:st}), el('div',{class:'mut', text: st===1 ? 'dia seguido' : 'dias seguidos'})),
      el('div',{style:'margin-left:auto;text-align:right'}, el('div',{class:'big', style:'font-size:30px;color:var(--acc2)', text:dset.size}), el('div',{class:'mut', text:'dias no total'}))),
    dots,
    el('button',{class:'btn', style:'margin-top:16px', text: mine ? 'Postar outro treino' : 'Registrar treino de hoje', onclick:openCheckin})));
  for (const g of myInvites()) wrap.append(inviteCard(g));
  // active challenge snapshot
  const act = activeChallenges().filter(c => inCh(c, S.me));
  for (const c of act.slice(0,2)){
    const sts = standings(c); const me = sts.findIndex(r => r.id === S.me);
    const left = diffDays(t, c.end);
    const box = el('div',{class:'card pad', style:'cursor:pointer', onclick:() => { S.rankCh = c.id; go('rank'); }},
      el('div',{class:'row'}, el('div',{}, el('div',{class:'ch-st st-on', text:'● '+c.name}), el('div',{class:'mut', style:'margin-top:3px', text: left===0 ? 'Último dia!' : 'Faltam '+left+(left===1?' dia':' dias')})),
        el('div',{style:'margin-left:auto;text-align:right'}, el('div',{style:"font-family:'Barlow Condensed';font-weight:800;font-size:28px;color:var(--acc)", text: me>=0 ? (me+1)+'º' : '-'}), el('div',{class:'mut', text:'sua posição'}))),
      el('div',{class:'row', style:'margin-top:12px;gap:14px'}, ...sts.slice(0,3).map((r,i) => el('div',{class:'row', style:'gap:6px;min-width:0'}, el('span',{text:['🥇','🥈','🥉'][i]}), avatar(r.id,'sm'), el('span',{class:'mut', style:'white-space:nowrap;overflow:hidden;text-overflow:ellipsis', text:nick(r.id).split(' ')[0]+' · '+r.pts})))));
    wrap.append(box);
  }
  // mural
  const mg = myGroups();
  if (S.feedGroup && !mg.find(g => g.id === S.feedGroup)) S.feedGroup = null;
  wrap.append(el('div',{class:'sec'}, el('h4',{text:'Mural'}), el('span',{class:'mut', text:'treinos da galera'})));
  if (mg.length) wrap.append(el('div',{class:'seg'},
    el('button',{class:'chip'+(!S.feedGroup?' on':''), text:'Todos', onclick:() => { S.feedGroup = null; render(); }}),
    ...mg.map(g => el('button',{class:'chip'+(S.feedGroup===g.id?' on':''), text:(g.emoji||'👥')+' '+g.name, onclick:() => { S.feedGroup = g.id; render(); }}))));
  const kind = S.feedKind || 'all';
  wrap.append(el('div',{class:'seg'}, ...[['all','Tudo'],['ch','🏆 Desafios'],['free','📸 Feed']].map(([v,l]) => el('button',{class:'chip'+(kind===v?' on':''), text:l, onclick:() => { S.feedKind = v; render(); }}))));
  let list = S.checkins.filter(k => !k.np);
  if (S.feedGroup){ const g = mg.find(x => x.id === S.feedGroup); const set = new Set(g.members||[]); list = list.filter(k => set.has(k.u)); }
  if (kind === 'ch') list = list.filter(k => !!k.ch);
  if (kind === 'free') list = list.filter(k => !k.ch);
  if (!list.length){ wrap.append(el('div',{class:'empty'}, el('div',{class:'big',text:'🏋️'}), 'Nenhum treino no mural ainda.', el('br'), 'Registre o primeiro!')); return wrap; }
  for (const k of list.slice(0, 120)) wrap.append(postCard(k));
  return wrap;
}
function postCard(k){
  const lk = S.likes.get(k.id) || new Set();
  const iLike = lk.has(S.me);
  const cms = S.comments.get(k.id) || [];
  const ph = el('div', {class:'ph-wait'});
  loadPhoto(k.id, ph);
  const likeBtn = el('button', {class:iLike ? 'liked' : '', 'aria-label':'Curtir', onclick:() => toggleLike(k.id, iLike)});
  likeBtn.innerHTML = iLike ? ICON.heartF : ICON.heart; likeBtn.append(el('span',{text:lk.size || ''}));
  const cmBtn = el('button', {'aria-label':'Comentários', onclick:() => openComments(k)}); cmBtn.innerHTML = ICON.chat; cmBtn.append(el('span',{text:cms.length || ''}));
  const ov = el('div',{class:'ov', onclick:() => go('user', k.u)}, avatar(k.u,'sm'),
    el('div',{}, el('div',{class:'nm', text:nick(k.u)}), el('div',{style:'font-size:12px;opacity:.8', text:ago(k.ts) + ' · às '+hm(k.ts) + (k.date !== dstr(new Date(k.ts)) ? ' · treino de '+fmtDate(k.date) : '')})));
  const pw = el('div',{class:'pw'}, ph, ov);
  ph.addEventListener('dblclick', () => { if (!iLike) toggleLike(k.id, false); });
  const card = el('div',{class:'card post'}, pw,
    el('div',{class:'meta'}, el('span',{class:'badge acc'}, (k.tipo ? k.tipo+' · ' : '') + actLabel(k)),
      el('div',{class:'acts'}, likeBtn, cmBtn,
        k.u === S.me ? (() => { const b = el('button',{'aria-label':'Story para o Instagram', title:'Story', onclick:() => openStory(k)}); b.innerHTML = ICON.share; return b; })() : null,
        (k.u === S.me || S.isOwner) ? el('button',{style:'color:var(--mut);font-size:13px', text:'Apagar', onclick:() => delCheckin(k)}) : null)));
  if (k.ch) { card.classList.add('ch-post'); card.prepend(el('div',{class:'ch-tag', text:'🏆 '+((S.challenges.find(c => c.id === k.ch) || {}).name || 'Desafio')})); }
  if (k.cap) card.append(el('div',{class:'cap', text:k.cap}));
  return card;
}
async function toggleLike(cid, iLike){
  const ref = S.db.doc('likes/'+cid+'__'+S.me);
  await w(() => iLike ? ref.delete() : ref.set({c:cid, u:S.me, ts:Date.now()}));
}
function delCheckin(k){
  confirmSheet('Apagar este check-in?', 'O ponto deste dia sai do ranking (se não houver outro check-in no mesmo dia).', async () => {
    await w(async () => {
      await S.db.doc('checkins/'+k.id).delete();
      await S.db.doc('photos/'+k.id).delete();
      for (const u of (S.likes.get(k.id) || [])) await S.db.doc('likes/'+k.id+'__'+u).delete().catch(()=>{});
      for (const c of (S.comments.get(k.id) || [])) await S.db.doc('comments/'+c.id).delete().catch(()=>{});

let openSheetEl = null;
function sheet(title, body, onClose){
  closeSheet();
  const bg = el('div',{class:'sheet-bg'});
  const sh = el('div',{class:'sheet'}, el('div',{class:'grab'}),
    el('div',{class:'sheet-h'}, el('h2',{text:title}), el('button',{class:'x', text:'✕', 'aria-label':'Fechar', onclick:closeSheet})), body);
  bg.append(sh);
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  document.body.append(bg); document.body.style.overflow = 'hidden';
  openSheetEl = {bg, onClose};
  return sh;
}
function closeSheet(){
  if (!openSheetEl) return;
  openSheetEl.bg.remove(); document.body.style.overflow = '';
  const f = openSheetEl.onClose; openSheetEl = null; if (f) f();
}
function confirmSheet(title, msg, onYes, yesText){

  sheet(title, el('div',{}, el('p',{class:'mut', style:'line-height:1.5', text:msg}), yes, el('div',{style:'height:8px'}), el('button',{class:'btn ghost', text:'Cancelar', onclick:closeSheet})));

  const tipoChips = el('div',{class:'chips'}, ...(S.assignedList && S.assignedList.length ? S.assignedList.map(t => rotulo(t)) : ['Push','Pull','Legs','Upper','Lower','Glutes','Quads']).map(n => el('button',{class:'chip', text:n, onclick:() => { tipo = n; tipoIn.value = n; }})));

function periodRange(p){

  if (p === 'week'){ const [y,m,d] = t.split('-').map(Number); const wd = (new Date(y,m-1,d).getDay()+6)%7; return [addDays(t,-wd), t, 'esta semana']; }

function parseAvBatch(txt){
  const clean = String(txt || '').replace(/\s+/g,'');
  const parts = clean.split('TRAVAGLI-AV:').slice(1);
  const seen = new Set(); const ok = []; let invalid = 0, repeated = 0;
  for (const part of parts){
    const av = parseAvCode('TRAVAGLI-AV:' + part);
    if (!av){ invalid++; continue; }
    if (av.src){ if (seen.has(av.src)){ repeated++; continue; } seen.add(av.src); }
    ok.push(av);
  }
  if (!parts.length && clean) invalid = 1;
  ok.sort((x,y) => x.data.localeCompare(y.data));
  return {ok, invalid, repeated};
}
function pasteAv(id){
  const ta = el('textarea',{rows:4, placeholder:'Cole aqui o código TRAVAGLI-AV:… (pode ser um ou vários)'});
  const prev = el('div');
  let batch = {ok:[], invalid:0, repeated:0};
  const first = nick(id);
  const save = el('button',{class:'btn', text:'Publicar na ficha de '+first, disabled:true, onclick: async () => {
    const list = batch.ok; if (!list.length) return;
    save.disabled = true;
    let done = 0;
    const ok = await w(async () => {
      for (const av of list){
        const ref = av.src ? S.db.doc('fichas/'+id+'/avs/'+av.src) : S.db.collection('fichas/'+id+'/avs').doc();
        await ref.set({...av, pub:Date.now()}); done++;
        save.textContent = 'Publicando '+done+' de '+list.length+'…';
      }
    }, list.length === 1 ? 'Avaliação publicada ✓' : list.length+' avaliações publicadas ✓');
    if (done){
      const srcs = new Set(list.map(a => a.src).filter(Boolean));
      await syncLastAv(id, [...(S.fichaAvs||[]).filter(a => !srcs.has(a.id)), ...list]);
    }
    if (ok) closeSheet();
    else { if (done) toast(done+' de '+list.length+' publicadas antes do erro'); save.disabled = false; label(); }
  }});
  const label = () => { const n = batch.ok.length;
    save.textContent = n > 1 ? 'Publicar '+n+' avaliações na ficha de '+first : 'Publicar na ficha de '+first; };
  const check = () => {
    batch = parseAvBatch(ta.value); label();
    if (!ta.value.trim()){ prev.replaceChildren(); save.disabled = true; return; }
    const pub = new Set((S.fichaAvs||[]).map(a => a.id));
    const kids = [];
    if (!batch.ok.length){ kids.push(el('div',{class:'note', text:'Nenhum código válido. Copie de novo no app de avaliação, pelo botão "Enviar para o Travagli Club".'})); }
    else {
      const card = el('div',{class:'card pad', style:'margin-top:12px'}, el('div',{class:'nm', style:'margin-bottom:4px', text: batch.ok.length === 1 ? '1 avaliação encontrada' : batch.ok.length+' avaliações encontradas'}));
      for (const av of batch.ok){
        const dup = av.src && pub.has(av.src);
        const other = av.nome && first && !av.nome.toLowerCase().includes(first.toLowerCase().split(' ')[0]);
        card.append(el('div',{class:'pick', style:'align-items:flex-start'},
          el('div',{style:'min-width:0'},
            el('div',{class:'nm', text:fmtDate(av.data)+(av.nome ? ' · '+av.nome : '')}),
            el('div',{class:'mut', text:fmt(av.peso,1)+' kg · '+fmt(av.pg,2)+'% gordura · massa magra '+fmt(av.kgM,1)+' kg'+(av.proto ? ' · '+av.proto : '')}),
            dup ? el('div',{class:'warn', style:'font-size:13px;margin-top:3px', text:'Já publicada — vai ser atualizada.'}) : null,
            other ? el('div',{class:'warn', style:'font-size:13px;margin-top:3px', text:'Confira: o nome é diferente do aluno desta ficha.'}) : null)));
      }
      kids.push(card);
    }
    if (batch.invalid) kids.push(el('div',{class:'warn', style:'font-size:13px;margin-top:8px', text: batch.invalid === 1 ? '1 código inválido foi ignorado.' : batch.invalid+' códigos inválidos foram ignorados.'}));
    if (batch.repeated) kids.push(el('div',{class:'mut', style:'font-size:13px;margin-top:4px', text: batch.repeated === 1 ? '1 código repetido foi ignorado.' : batch.repeated+' códigos repetidos foram ignorados.'}));
    prev.replaceChildren(...kids);
    save.disabled = !batch.ok.length;
  };
  ta.addEventListener('input', check);
  sheet('Colar avaliações', el('div',{}, el('div',{class:'mut', style:'margin-bottom:10px;line-height:1.45', text:'No app de avaliação: abra a avaliação → "📤 Enviar para o Travagli Club" → Copiar. Pode colar um código ou vários, um por linha.'}), ta, prev, el('div',{style:'height:14px'}), save));
}

function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
async function getPhoto(id){
  if (S.photos.has(id)) return S.photos.get(id);
  try { const s = await S.db.doc('photos/'+id).get(); const v = s.exists ? s.data().d : null; S.photos.set(id, v); return v; } catch(e){ return null; }
}
async function storyBlob(k){
  const B = BRAND, W = 1080, H = 1920;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  try { await document.fonts.ready; await document.fonts.load('700 60px "'+B.font+'"'); } catch(e){}
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0, B.bg1); g.addColorStop(1, B.bg2); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const rg = ctx.createRadialGradient(W, 0, 10, W, 0, 900); rg.addColorStop(0, B.glow); rg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  // topo: logo + nome
  try { const lg = await loadImg(LOGO_ICON); const lh = 96, lw = lg.width * lh / lg.height; ctx.drawImage(lg, 70, 92, lw, lh);
    ctx.font = '700 64px "'+B.font+'", sans-serif'; ctx.textBaseline = 'middle'; ctx.fillStyle = B.tx; ctx.fillText(B.n1, 70+lw+28, 142);
    const w1 = ctx.measureText(B.n1+' ').width; ctx.fillStyle = B.acc; ctx.fillText(B.n2, 70+lw+28+w1, 142); } catch(e){}
  // foto
  const px = 60, py = 250, pw = 960, ph = 1180;
  ctx.save(); rr(ctx, px, py, pw, ph, 48); ctx.clip(); ctx.fillStyle = '#222'; ctx.fillRect(px, py, pw, ph);
  const src = await getPhoto(k.id);
  if (src){ try { const im = await loadImg(src); const sc = Math.max(pw/im.width, ph/im.height); const iw = im.width*sc, ih = im.height*sc; ctx.drawImage(im, px+(pw-iw)/2, py+(ph-ih)/2, iw, ih); } catch(e){} }
  const og = ctx.createLinearGradient(0, py+ph-420, 0, py+ph); og.addColorStop(0,'rgba(0,0,0,0)'); og.addColorStop(1,'rgba(0,0,0,.85)'); ctx.fillStyle = og; ctx.fillRect(px, py+ph-420, pw, 420);
  ctx.restore();
  ctx.strokeStyle = B.acc; ctx.lineWidth = 4; rr(ctx, px, py, pw, ph, 48); ctx.stroke();
  // texto sobre a foto
  ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff';
  ctx.font = '700 46px Inter, sans-serif'; ctx.fillText(nick(k.u), px+48, py+ph-120);
  ctx.font = '500 36px Inter, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
  const [yy,mm,dd] = k.date.split('-'); ctx.fillText(actLabel(k)+'  ·  '+dd+'/'+mm+'/'+yy+'  ·  às '+hm(k.ts), px+48, py+ph-60);
  if (k.tipo){ ctx.font = '700 48px "'+B.font+'", sans-serif'; const tw = ctx.measureText(k.tipo).width; ctx.fillStyle = B.acc; rr(ctx, px+40, py+40, tw+64, 92, 46); ctx.fill(); ctx.fillStyle = B.bg1; ctx.fillText(k.tipo, px+72, py+104); }
  // números
  const st = streak(k.u), tot = userDates(k.u).size;
  const ch = activeChallenges().find(c => inCh(c, k.u)); let pos = null; if (ch){ const s2 = standings(ch); const i = s2.findIndex(r => r.id === k.u); if (i >= 0) pos = {i:i+1, n:s2.length, name:ch.name, pts:s2[i].pts}; }
  const blocks = [[String(st), st===1?'DIA SEGUIDO':'DIAS SEGUIDOS'], [String(tot), tot===1?'DIA TREINADO':'DIAS TREINADOS']];
  if (pos) blocks.push([pos.i+'º', 'NO DESAFIO']);
  const bw = (W - 120 - (blocks.length-1)*24) / blocks.length, by = 1480, bh = 230;
  blocks.forEach(([big, lbl], i) => {
    const bx = 60 + i*(bw+24);
    ctx.fillStyle = B.card; rr(ctx, bx, by, bw, bh, 36); ctx.fill(); ctx.strokeStyle = B.line; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = B.acc; ctx.font = '700 110px "'+B.font+'", sans-serif'; ctx.fillText((i===0?'🔥':'')+big, bx+bw/2, by+130);
    ctx.fillStyle = B.mut; ctx.font = '600 28px Inter, sans-serif'; ctx.fillText(lbl, bx+bw/2, by+185); ctx.textAlign = 'left';
  });
  if (pos){ ctx.textAlign = 'center'; ctx.fillStyle = B.tx; ctx.font = '500 34px Inter, sans-serif'; ctx.fillText(pos.name+' · '+pos.pts+(pos.pts===1?' ponto':' pontos'), W/2, by+bh+90); ctx.textAlign = 'left'; }
  ctx.textAlign = 'center'; ctx.fillStyle = B.mut; ctx.font = '600 34px Inter, sans-serif'; ctx.fillText(B.tag, W/2, H-56); ctx.textAlign = 'left';
  return await new Promise(res => cv.toBlob(res, 'image/jpeg', .9));
}
function offerStory(k){
  const go2 = el('button',{class:'btn', text:'📸 Criar story do treino', onclick:() => openStory(k)});
  sheet('Treino registrado! 💪', el('div',{}, el('p',{class:'mut', style:'margin-top:0;line-height:1.5', text:'Quer mostrar no Instagram? A gente monta uma imagem de story com a sua foto, os seus dias seguidos e a sua posição no desafio.'}), go2, el('div',{style:'height:8px'}), el('button',{class:'btn ghost', text:'Agora não', onclick:closeSheet})));
}
async function openStory(k){
  const box = el('div',{class:'center', style:'min-height:200px;justify-content:center'}, el('div',{class:'mut', text:'Montando a imagem…'}));
  sheet('Story do treino', el('div',{}, box));
  let blob = null;
  try { blob = await storyBlob(k); } catch(e){ console.warn(e); }
  if (!blob){ box.replaceChildren(el('div',{class:'mut', text:'Não consegui montar a imagem. Tente de novo.'})); return; }
  const url = URL.createObjectURL(blob);
  const dl = await claude.use('downloads');
  const btn = el('button',{class:'btn', text:'📲 Compartilhar no Instagram', onclick: async () => {
    if (!dl) return;
    btn.disabled = true;
    try { await dl.save({filename: BRAND.file+'-treino-'+k.date+'.jpg', data: blob}); toast('Pronto! Agora é só postar 📸'); }
    catch(e){ if (e && e.code === 'declined') {} else if (e && e.code === 'rate_limited') toast('Espere um instante e tente de novo'); else toast('Não deu para salvar aqui. Segure a imagem para salvar.'); }
    btn.disabled = false;
  }});
  box.replaceChildren(
    el('img',{src:url, alt:'Imagem do story', style:'width:100%;max-width:300px;border-radius:16px;border:1px solid var(--line);margin-bottom:14px'}),
    dl ? btn : null,
    el('div',{class:'mut', style:'margin-top:10px;line-height:1.45;font-size:13px', text: dl
      ? 'No app do Claude: escolha o Instagram na lista que abrir (ou "Salvar imagem" e poste pelo Instagram). No navegador: a imagem vai para os seus downloads.'
      : 'Segure a imagem e toque em "Salvar" para postar no Instagram.'}));
}

function chalView(){
  const wrap = el('div');
  wrap.append(el('div',{class:'row', style:'justify-content:space-between'}, el('h2',{text:'Desafios'}),
    S.isOwner ? el('button',{class:'btn sm', text:'+ Novo', onclick:() => editChallenge()}) : null));
  const groups = [['on','Em andamento'],['up','Em breve'],['end','Encerrados']];
  let any = false;
  for (const [k, lbl] of groups){
    const cs = S.challenges.filter(c => chStatus(c) === k).sort((a,b) => k==='end' ? b.end.localeCompare(a.end) : a.start.localeCompare(b.start));
    if (!cs.length) continue; any = true;
    wrap.append(el('div',{class:'mut', style:'margin:14px 2px 8px;font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.6px', text:lbl}));
    for (const c of cs){
      const mine = inCh(c, S.me);
      const st = standings(c); const me = st.findIndex(r => r.id === S.me);
      const card = chHeader(c);
      const foot = el('div',{class:'row', style:'margin-top:12px;gap:8px;flex-wrap:wrap'},
        mine ? el('span',{class:'badge acc', text: me>=0 ? 'Você: '+st[me].pts+' pts' : 'Participando'}) : el('span',{class:'badge', text:'Você não está neste desafio'}),
        el('button',{class:'btn sm ghost', style:'margin-left:auto', text:'Ver ranking', onclick:() => { S.rankCh = c.id; go('rank'); }}),
        S.isOwner ? el('button',{class:'btn sm ghost', text:'Editar', onclick:() => editChallenge(c)}) : null);
      card.append(foot);
      wrap.append(card);
    }
  }
  if (!any) wrap.append(el('div',{class:'empty'}, el('div',{class:'big',text:'🏆'}),
    S.isOwner ? 'Nenhum desafio ainda. Toque em "+ Novo" para criar o primeiro — por exemplo, "30 dias de dezembro".' : 'Nenhum desafio ainda. Enquanto isso, seus check-ins já contam para a sua sequência! 🔥'));
  if (S.isOwner){
    const n = S.members.size;
    wrap.append(el('div',{class:'card pad', style:'margin-top:20px'},
      el('h3',{text:'Alunos no clube ('+n+')'}),
      el('div',{class:'mut', style:'margin-bottom:8px', text:'Quem já entrou no app aparece aqui.'}),
      ...[...S.members.keys()].sort((a,b) => nick(a).localeCompare(nick(b))).map(id => el('div',{class:'pick', style:'cursor:pointer', onclick:() => go('user', id)}, avatar(id,'sm'), el('span',{text:nick(id)}), el('span',{class:'mut', style:'margin-left:auto', text:'🔥 '+streak(id)})))));
  }
  return wrap;
}
function editChallenge(c){
  const isNew = !c;
  const t = today();
  c = c || {name:'', desc:'', start:t, end:addDays(t, 29), everyone:true, members:[]};
  const name = el('input',{value:c.name, maxlength:50, placeholder:'Ex.: Desafio 30 dias de dezembro'});
  const desc = el('textarea',{rows:3, maxlength:500, placeholder:'Regras, prêmio, recado para os alunos… (opcional)'}); desc.value = c.desc || '';
  const start = el('input',{type:'date', value:c.start});
  const end = el('input',{type:'date', value:c.end});
  let everyone = !!c.everyone; const sel = new Set(c.members || []);
  const who = el('div');
  const drawWho = () => {
    who.replaceChildren(
      el('div',{class:'chips'}, el('button',{class:'chip'+(everyone?' on':''), text:'Todos os alunos', onclick:() => { everyone = true; drawWho(); }}),
        el('button',{class:'chip'+(!everyone?' on':''), text:'Escolher quem participa', onclick:() => { everyone = false; drawWho(); }})),
      everyone ? el('div',{class:'mut', style:'margin-top:8px', text:'Inclui também quem entrar no app depois.'}) :

function treinoItens(itens){ return (itens || []).map(i => ({ex:i.ex, nome:i.nome || exNome(i.ex), prescr:i.prescr || '', aq:+i.aq || 0, ap:+i.ap || 0, desc:i.desc || '', sr:+i.sr || 0, rmin:+i.rmin || 0, rmax:+i.rmax || 0, uni:!!i.uni})); }
const roundLoad = x => x >= 20 ? Math.round(x/2.5)*2.5 : Math.max(1, Math.round(x));
const isWarm = t => t === 'A' || t === 'P';
const prepTxt = i => [i.aq ? i.aq+' aquec.' : '', i.ap ? i.ap+' aprox.' : ''].filter(Boolean).join(' + ');
const repsTxt = i => !i.rmin && !i.rmax ? '' : (i.rmin && i.rmax && i.rmin !== i.rmax) ? i.rmin+'-'+i.rmax : String(i.rmax || i.rmin);
const trabTxt = i => i.sr || repsTxt(i) ? (i.sr ? i.sr+' × ' : '') + (repsTxt(i) ? repsTxt(i)+' reps' : 'séries') : '';
const uniTag = i => i.uni ? ' (unilateral)' : '';
const prescrTxt = i => [i.uni ? 'unilateral, reps por lado' : '', prepTxt(i), trabTxt(i), i.prescr, i.desc ? 'descanso '+i.desc : ''].filter(Boolean).join(' · ');
function prepSets(aq, ap, base){
  const out = [];
  for (let k = 0; k < aq; k++){ const pct = Math.min(0.6, 0.4 + 0.1*k); out.push({t:'A', r:'', kg:'', phR:10, phKg: base ? roundLoad(base*pct) : ''}); }
  const plan = ap <= 1 ? [[0.8,3]] : ap === 2 ? [[0.7,5],[0.85,3]] : [[0.6,5],[0.75,3],[0.9,1]];
  for (let k = 0; k < ap; k++){ const pl = plan[Math.min(k, plan.length-1)]; out.push({t:'P', r:'', kg:'', phR:pl[1], phKg: base ? roundLoad(base*pl[0]) : ''}); }
  return out;
}
function mergeItens(base, extra){
  const out = treinoItens(base);
  for (const i of treinoItens(extra)) if (!out.some(o => o.ex === i.ex)) out.push(i);
  return out;
}

function exHistory(exId, list){
  const rows = []; let best = 0, maxKg = 0, maxR = 0;
  for (const s of list || []){
    const it = (s.itens || []).find(i => i.ex === exId); if (!it) continue;
    const ws = (it.sets || []).filter(x => !isWarm(x.t)); if (!ws.length) continue;
    rows.push({date:s.date, sets:it.sets});
    for (const x of ws){ best = Math.max(best, e1rm(+x.kg, +x.r)); if ((+x.kg || 0) > maxKg){ maxKg = +x.kg; maxR = +x.r || 0; } }
  }
  sheet(exNome(exId), el('div',{},
    rows.length ? el('div',{class:'rec'},
      el('div',{}, el('b',{text: maxKg ? fmt(maxKg, maxKg % 1 ? 1 : 0)+' kg' : '—'}), el('span',{text:'maior carga'+(maxR ? ' ('+maxR+' reps)' : '')})),
      el('div',{}, el('b',{text: best ? fmt(best, 0)+' kg' : '—'}), el('span',{text:'1RM estimado'}))) : null,
    ...(rows.length ? rows.slice(0, 30).map(r => el('div',{class:'pick'}, el('div',{}, el('div',{class:'nm', text:fmtDate(r.date)}), el('div',{class:'mut', style:'font-size:13px', text:fmtSets(r.sets)}))))

  const d = S.draft;
  const wrap = el('div');
  const filled = () => d.itens.some(i => i.sets.some(s => s.r || s.kg));
  wrap.append(el('div',{class:'row', style:'align-items:center;gap:10px'},
    el('button',{class:'link', text:'← Sair', onclick:() => go('logbook')}),
    el('h2',{text: d.nome || 'Novo treino', style:'margin:0'})));
  const tot = d.itens.reduce((a, i) => a + i.sets.length, 0), feitas = d.itens.reduce((a, i) => a + i.sets.filter(s => s.done).length, 0);
  wrap.append(el('div',{class:'row', style:'gap:10px;align-items:end'},
    el('div',{style:'flex:1'}, el('label',{text:'Data do treino'}), el('input',{type:'date', value:d.date, onchange: e => { d.date = e.target.value || today(); saveDraft(); }})),
    el('div',{class:'mut', style:'padding-bottom:12px;font-size:13px', text: feitas+' de '+tot+' séries feitas'})));
  if (S.isOwner) wrap.append(el('div',{class:'mut', style:'font-size:12px;margin-top:8px;line-height:1.45', text:'Toque no número da série para mudar o tipo: A aquecimento, P aproximação, D drop-set, F até a falha. Marque ✓ ao terminar cada série.'}));
  if (!d.itens.length) wrap.append(el('div',{class:'mut', style:'padding:14px 0', text:'Adicione os exercícios do treino.'}));
  d.itens.forEach((it, idx) => wrap.append(exBlock(d, it, idx)));
  if (S.isOwner) wrap.append(el('button',{class:'btn ghost', style:'width:100%;margin-top:12px', text:'＋ Adicionar exercício', onclick:() => { S.retY = window.scrollY; go('logpick'); }}));
  wrap.append(el('button',{class:'btn', style:'width:100%;margin-top:12px', text:'Salvar treino', disabled: !filled(), onclick: async () => {
    const itens = d.itens.map(i => ({ex:i.ex, nome:exNome(i.ex), ...(i.uni ? {uni:true} : {}), sets:i.sets.filter(s => s.r || s.kg).map(s => ({ ...(s.t ? {t:s.t} : {}),
      r: s.r === '' || s.r == null ? null : Number(s.r),
      kg: s.kg === '' || s.kg == null ? null : Number(String(s.kg).replace(',', '.'))}))})).filter(i => i.sets.length);
    if (!itens.length){ toast('Preencha pelo menos uma série'); return; }
    const data = {date:d.date, ts:Date.now(), itens, nome: d.nome || null};
    const saved = await w(() => S.db.doc('sessoes/'+S.me+'/'+d.id).set(data), 'Treino salvo ✓');
    if (saved){ S.draft = null; clearDraft(); go('logbook'); }
  }}));
  wrap.append(el('button',{class:'link', style:'display:block;margin:16px auto 90px;color:var(--mut)', text:'Descartar este treino', onclick:() => confirmSheet('Descartar o treino?', 'O que você anotou hoje e ainda não salvou será perdido.', () => { S.draft = null; clearDraft(); go('logbook'); }, 'Descartar')}));
  return wrap;
}

function exBlock(d, it, idx){
  const last = lastOf(it.ex);
  let n = 0;
  const rows = it.sets.map((s, si) => {
    if (!isWarm(s.t)) n++;
    const lb = s.t || String(n);
    return el('div',{class:'srow'+(s.done ? ' done' : '')},
      el('button',{class:'stype'+(s.t ? ' t'+s.t : '')+(S.isOwner ? '' : ' ro'), text:lb, 'aria-label': S.isOwner ? 'Mudar tipo da série' : 'Tipo da série', ...(S.isOwner ? {onclick:() => { s.t = SET_TYPES[(SET_TYPES.indexOf(s.t || '') + 1) % SET_TYPES.length]; if (!s.t) delete s.t; saveDraft(); render(); }} : {disabled:true})}),
      el('input',{type:'number', inputmode:'numeric', placeholder: s.phR ? String(s.phR) : 'reps', value: s.r ?? '', oninput: e => { s.r = e.target.value; saveDraft(); }}),
      el('input',{type:'number', inputmode:'decimal', step:'any', placeholder: s.phKg ? s.phKg+' kg' : 'kg', value: s.kg ?? '', oninput: e => { s.kg = e.target.value; saveDraft(); }}),
      el('button',{class:'scheck'+(s.done ? ' on' : ''), text:'✓', 'aria-label':'Série feita', onclick:() => toggleDone(it, s)}),
      (S.isOwner ? el('button',{class:'link', style:'color:var(--mut)', text:'✕', 'aria-label':'Apagar série', onclick:() => { it.sets.splice(si, 1); if (!it.sets.some(x => !isWarm(x.t))) it.sets.push({r:'', kg:''}); saveDraft(); render(); }}) : null));
  });
  return el('div',{class:'card pad', style:'margin-top:10px'},
    el('div',{class:'row', style:'align-items:center'}, el('b',{text:exNome(it.ex)+uniTag(it), style:'flex:1'}),
      el('button',{class:'link', style:'font-size:22px;line-height:1;padding:0 6px;color:var(--tx)', text:'…', 'aria-label':'Opções do exercício', onclick:() => exMenu(d, idx)})),
    (it.prescr || it.aq || it.ap || it.desc) ? el('div',{class:'mut', style:'font-size:13px;margin-top:4px', text:'Prescrito: '+prescrTxt(it)}) : null,
    el('div',{class:'mut', style:'font-size:12px;margin-top:4px', text: last ? 'Última vez ('+fmtDate(last.date).slice(0,5)+'): '+fmtSets(last.sets) : 'Primeira vez com este exercício'}),
    ...rows,
    (S.isOwner ? el('button',{class:'btn ghost sm', style:'margin-top:10px', text:'+ série', onclick:() => { const ws = it.sets.filter(x => !isWarm(x.t)); const p = ws[ws.length-1] || {}; it.sets.push({r:p.r || '', kg:p.kg || ''}); saveDraft(); render(); }}) : null));
}

// ---------- progresso ----------
function weekStart(ds){ const [y,m,dd] = ds.split('-').map(Number); const wd = (new Date(y, m-1, dd).getDay() + 6) % 7; return addDays(ds, -wd); }
function progressView(){
  const uid = S.progFor || S.me; const mine = uid === S.me;
  const list = mine ? (S.sessoes || []) : (S.fichaSessoes || []);
  const wrap = el('div');
  wrap.append(el('div',{class:'row', style:'align-items:center;gap:10px'},
    el('button',{class:'link', text:'← Voltar', onclick:() => go(mine ? 'logbook' : 'ficha')}),
    el('h2',{text: mine ? 'Progresso' : 'Progresso de '+nick(uid), style:'margin:0'})));
  if (!mine && S.fichaSessoes == null){ wrap.append(el('div',{class:'mut', style:'padding:14px 0', text:'Carregando…'})); return wrap; }
  if (!list.length){ wrap.append(el('div',{class:'empty'}, el('div',{class:'big',text:'📈'}), mine ? 'Registre seus treinos no logbook para ver o progresso.' : 'Este aluno ainda não registrou treinos.')); return wrap; }
  const wk = weekStart(today());
  const weeks = [...Array(8)].map((_, k) => addDays(wk, -7*(7-k)));
  const perWeek = new Map(weeks.map(w => [w, 0]));
  const grupos = new Map(); let treinos = 0, series = 0, vol = 0;
  const recs = new Map();
  for (const s of list){
    const ws0 = weekStart(s.date || today());
    if (ws0 === wk) treinos++;
    for (const it of (s.itens || [])){
      const work = (it.sets || []).filter(x => !isWarm(x.t));
      if (perWeek.has(ws0)) perWeek.set(ws0, perWeek.get(ws0) + work.length);
      if (ws0 === wk){
        series += work.length;
        const g = exGrupo(it.ex); grupos.set(g, (grupos.get(g) || 0) + work.length);
        for (const x of work) vol += (+x.kg || 0) * (+x.r || 0);
      }
      for (const x of work){
        const r = recs.get(it.ex) || {nome: it.nome || exNome(it.ex), kg:0, r:0, e1:0, date:''};
        const kg = +x.kg || 0, e = e1rm(kg, +x.r || 0);
        if (kg > r.kg || (kg === r.kg && (+x.r || 0) > r.r) || (kg === r.kg && (+x.r || 0) === r.r && kg > 0 && (s.date || '') < r.date)){ r.kg = kg; r.r = +x.r || 0; r.date = s.date; }
        if (e > r.e1) r.e1 = e;
        recs.set(it.ex, r);
      }
    }
  }
  wrap.append(el('div',{class:'rec', style:'grid-template-columns:1fr 1fr 1fr;margin-top:14px'},
    el('div',{}, el('b',{text:String(treinos)}), el('span',{text:'treinos na semana'})),
    el('div',{}, el('b',{text:String(series)}), el('span',{text:'séries de trabalho'})),
    el('div',{}, el('b',{text: vol >= 1000 ? fmt(vol/1000, 1)+' t' : fmt(vol, 0)+' kg'}), el('span',{text:'volume (kg × reps)'}))));
  const gc = el('div',{class:'card pad'}, el('div',{class:'nm', text:'Séries por grupo muscular · esta semana'}));
  const gl = [...grupos.entries()].sort((a,b) => b[1] - a[1]);
  if (!gl.length) gc.append(el('div',{class:'mut', style:'margin-top:8px', text:'Nenhuma série registrada nesta semana ainda.'}));
  const gmax = Math.max(20, ...gl.map(x => x[1]));
  for (const [g, v] of gl) gc.append(el('div',{class:'gbar'}, el('span',{text:g}), el('div',{class:'gtrack'}, el('i',{style:'width:'+Math.round(v/gmax*100)+'%'})), el('b',{text:String(v)})));
  gc.append(el('div',{class:'mut', style:'font-size:12px;margin-top:10px', text:'Aquecimento e aproximação não entram na conta.'}));
  wrap.append(gc);
  const wmax = Math.max(1, ...perWeek.values());
  wrap.append(el('div',{class:'card pad'}, el('div',{class:'nm', text:'Séries de trabalho por semana'}),
    el('div',{class:'wbars'}, ...weeks.map(w => { const v = perWeek.get(w); return el('div',{class:'wbar'+(w === wk ? ' cur' : '')}, el('b',{text:String(v)}), el('i',{style:'height:'+Math.max(3, Math.round(v/wmax*90))+'px'}), el('span',{text:w.slice(8,10)+'/'+w.slice(5,7)})); }))));
  const rl = [...recs.entries()].filter(([, r]) => r.kg > 0).sort((a,b) => (b[1].date || '').localeCompare(a[1].date || ''));
  const rc = el('div',{class:'card pad'}, el('div',{class:'nm', text:'🏆 Recordes'}));
  if (!rl.length) rc.append(el('div',{class:'mut', style:'margin-top:8px', text:'Ainda sem cargas registradas.'}));
  for (const [ex, r] of rl.slice(0, 40)) rc.append(el('div',{class:'pick', style:'cursor:pointer', onclick:() => exHistory(ex, list)},
    el('div',{style:'flex:1;min-width:0'}, el('div',{class:'nm', text:r.nome}), el('div',{class:'mut', style:'font-size:12px', text:'em '+fmtDate(r.date)+(r.e1 ? ' · 1RM estimado '+fmt(r.e1, 0)+' kg' : '')})),
    el('b',{text: fmt(r.kg, r.kg % 1 ? 1 : 0)+' kg'+(r.r ? ' × '+r.r : '')})));
  wrap.append(rc);
  if (!mine){ wrap.append(el('div',{class:'nm', style:'margin:16px 2px 8px', text:'Treinos registrados'}), sessList(list, false)); }
  return wrap;
}

function addEx(id){
  const d = S.draft; if (!d) return;
  if (S.draftKind === 'coach'){
    if (S.swapIdx != null && d.itens[S.swapIdx]){ d.itens[S.swapIdx] = {...d.itens[S.swapIdx], ex:id, nome:exNome(id), ...sugestaoSeries(id)}; S.swapIdx = null; }
    else d.itens.push({ex:id, nome:exNome(id), prescr:'', ...sugestaoSeries(id), desc:'', uni:false});
    S.pickQ = ''; S.pickG = 'Todos'; go('coach'); S.restoreY = null; { const y = S.retY || 0; S.retY = null; S.restoreY = y; render(); } return;
  }
  const last = lastOf(id);
  d.itens.push({ex:id, sets: last ? last.sets.map(x => ({r:x.r ?? '', kg:x.kg ?? ''})) : [{r:'',kg:''}]});
  S.pickQ = ''; S.pickG = 'Todos';
  saveDraft(); go('logsess'); { const y = S.retY || 0; S.retY = null; S.restoreY = y; render(); }
}

function pickerView(){
  if (!S.draft){ go('logbook'); return el('div'); }
  const wrap = el('div');
  const res = el('div',{style:'margin-top:10px'});
  const drawRes = () => {
    const q = (S.pickQ || '').trim();
    const termo = q.toLowerCase();
    const curG = S.pickG || 'Todos';
    const arr = exAll().filter(e => (curG === 'Todos' || e[2] === curG) && (!termo || e[1].toLowerCase().includes(termo)));
    res.replaceChildren(
      ...arr.slice(0, 100).map(e => el('button',{class:'card pad', style:'display:block;width:100%;text-align:left;margin-bottom:8px;cursor:pointer', onclick:() => addEx(e[0])},
        el('div',{text:e[1]}), el('div',{class:'mut', style:'font-size:12px', text:e[2]}))),
      (S.isOwner && termo && !arr.some(e => e[1].toLowerCase() === termo)) ? el('button',{class:'btn ghost', style:'width:100%', text:'Cadastrar "'+q+'"', onclick: async () => {
        const id = 'x-'+newId();
        const grupo = curG === 'Todos' ? 'Outro' : curG;
        const ok = await w(() => S.db.doc('exercicios/'+id).set({nome:q.slice(0,80), grupo}), 'Exercício cadastrado ✓');
        if (ok) addEx(id);
      }}) : null);
  };
  const grupos = ['Todos', ...new Set(exAll().map(e => e[2]))];
  wrap.append(el('div',{class:'row', style:'align-items:center;gap:10px'},
    el('button',{class:'link', text:'← Voltar', onclick:() => { S.swapIdx = null; const y = S.retY || 0; S.retY = null; go(S.draftKind === 'coach' ? 'coach' : 'logsess'); S.restoreY = y; render(); }}),
    el('h2',{text: S.swapIdx != null ? 'Trocar exercício' : 'Adicionar exercício', style:'margin:0'})));
  wrap.append(el('input',{type:'search', placeholder:'Buscar (ex.: supino inclinado)', value: S.pickQ || '', style:'width:100%;margin-top:12px', oninput: e => { S.pickQ = e.target.value; drawRes(); }}));
  wrap.append(el('div',{class:'chips', style:'margin-top:10px'}, ...grupos.map(g => el('button',{class:'chip'+((S.pickG||'Todos')===g?' on':''), text:g, onclick:() => { S.pickG = g; render(); }}))));
  wrap.append(res);
  drawRes();
  return wrap;
}

boot().catch(e => { console.error(e); $('#main').replaceChildren(el('div',{class:'empty',text:'Algo deu errado ao abrir o app. Recarregue a página.'})); });
})();
</script>
